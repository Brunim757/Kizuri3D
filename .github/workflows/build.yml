name: build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Cache third-party deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', '**/CMakeLists.txt') }}
      - name: MSVC version stamp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $cl = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter cl.exe | Where-Object { $_.FullName -match "Hostx64" } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $cl) { $cl = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter cl.exe | Select-Object -First 1 -ExpandProperty FullName
          }
          & "$cl" 2>&1 | Select-Object -First 1 | Out-File -FilePath build/msvc-stamp.txt -NoNewline
      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: build
          key: build-sse2-${{ runner.os }}-${{ hashFiles('build/msvc-stamp.txt', '**/*.cpp', '**/*.h', '**/*.hlsl', 'CMakeLists.txt', 'cmake/**', '**/CMakeLists.txt') }}
          restore-keys: |
            build-sse2-${{ runner.os }}-
      - name: Validate shaders
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter fxc.exe | Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $fxc) { throw "fxc not found" }
          $failed = $false
          Get-ChildItem "Shaders/*.hlsl" -Exclude "Fsr*" | ForEach-Object {
            $profile = if ($_.Name -match "VS\.hlsl$") { "vs_5_0" } elseif ($_.Name -match "HS\.hlsl$") { "hs_5_0" } elseif ($_.Name -match "DS\.hlsl$") { "ds_5_0" } elseif ($_.Name -match "CS\.hlsl$") { "cs_5_0" } else { "ps_5_0" }
            & "$fxc" /nologo /T $profile /E main /I Shaders $_.FullName /Fo NUL
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::$($_.Name) failed to compile"; $failed = $true }
          }
          if ($failed) { throw "shader validation failed" }
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Verify x64 baseline
        shell: pwsh
        run: |
          $matches = Get-ChildItem build -Recurse -Filter *.vcxproj | Select-String -Pattern '/arch:AVX' -SimpleMatch
          if ($matches) {
            $matches | ForEach-Object { Write-Host "::error file=$($_.Path),line=$($_.LineNumber)::$($_.Line.Trim())" }
            throw "AVX/AVX2 encontrado; o baseline x64 deve ser SSE2."
          }
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Run KizuriHello
        run: ./build/bin/Release/KizuriHello.exe
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: Kizuri3D-windows-x64
          path: build/bin/Release/
          if-no-files-found: error
